<!DOCTYPE html>
<html lang="en">
<head>
  <style>
    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr); 
      gap: 15px;
      background-color: #f1f1f1;
      padding: 15px;
    }
    .grid-item {
      background-color: #007acc;
      color: white;
      padding: 20px;
      text-align: center;
      font-family: sans-serif;
      border-radius: 5px;
    }
    .grid-container-fixed {
  display: grid;
  padding:12px;
  box-shadow:inset;
  gap:9px;
  background-color: aqua;
  grid-template-columns: 100px 200px 100px;
}
.grid-container-fractional {
  display: grid;
  background-color:burlywood;
  padding:23px;
  column-gap:12px;
  row-gap:2px;
  grid-template-columns: 1fr 4fr 1fr;
}
.grid-container-repeat {
  display: grid;
  background-color: rgb(212, 192, 112);
  gap:8px;
  padding:16px;
   grid-template-columns: repeat(2, 2fr);
}
.grid-container-percentage {
  display: grid;
  gap:4px;
  padding:13px;
  background-color:rgb(136, 196, 24);
   grid-template-columns: 35% 34% 21% ;
    
}
.grid-container-auto {
  display: grid;
  padding:14px;
  gap:3px;
  background-color: rgb(187, 12, 87);
    grid-template-columns: auto auto auto;
}
.back-btn{
    text-decoration: none;
    background-color:green;
    border: 3px solid darkgreen;
    color: aliceblue;
}
  </style>
</head>
<body>
    <a href="index.html" class="back-btn"> Return to back</a>
<h2> Grid template layout</h2>
  <div class="grid-container">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div><br>
     <h3>fixed</h3>
  <div class="grid-container-fixed">
 
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div><br>
  <h3>Fractional grid</h3>
  <div class="grid-container-fractional">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div><br>
<h3>Repeat</h3>
  <div class="grid-container-repeat">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div><br>
  <h3> Percentage</h3>
    <div class="grid-container-percentage">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div><br>
  <h3> by defalut grid template setting</h3>
    <div class="grid-container-auto">
    <div class="grid-item">Box 1</div>
    <div class="grid-item">Box 2</div>
    <div class="grid-item">Box 3</div>
    <div class="grid-item">Box 4</div>
  </div>

</body>
</html>
