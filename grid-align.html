<style>
    .grid-item{
       
        background-color: beige;

    .align-container{
        display:grid;
        grid-template-columns: 1fr auto ;
        align-items:center;
        background-color:rgb(255, 158, 31);
        padding:12px;
        gap:12px;
    }
     .align-container1{
        display:grid;
        grid-template-columns:repeat(2, 230px) ;

        grid-template-columns: 1fr   auto ;
        gap:12px;

        background-color: rgb(143, 209, 20);
        padding:12px;
    }
    .back-btn{
      text-decoration: none;
      color:rgb(74, 143, 5);
      background-color:burlywood;
      padding:12px;
    }
    </style>

<div class="grid-item">item1</div>
<div class="grid-item">item1</div>

<div class="grid-item">item1</div>
